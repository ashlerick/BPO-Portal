<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b241a" />
    <meta name="apple-mobile-web-app-title" content="BPO Portal" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPO Portal</title>
    <script>
      // Applied before first paint (and before React mounts) to avoid
      // a flash of the wrong theme. Defaults to dark, not the OS
      // preference — most people using this at all are on a night
      // shift, where the bright light theme is a real eye-strain
      // complaint. Anyone can still switch via the header toggle,
      // which is what sets bpo_theme.
      ;(function () {
        var stored = localStorage.getItem('bpo_theme')
        var isDark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
    <script>
      // Matching half of the 404.html redirect trick — decodes a path
      // encoded by 404.html back into the real URL before React Router
      // mounts. See public/404.html for why this exists.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
