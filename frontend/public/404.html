<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BPO Portal</title>
    <script>
      // GitHub Pages serves static files only, so a hard reload/direct link to a
      // client-routed path (e.g. /BPO-Portal/reports) hits this 404 page instead
      // of index.html. Encode the intended path into a query string and redirect
      // to the app root; index.html's matching script decodes it and restores
      // the real URL via history.replaceState before React Router mounts.
      // Technique: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // keep "/BPO-Portal"

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          // A value that changes every time, so the browser can never answer this
          // redirect from a cached copy of the app's entry page (which would keep
          // showing the previous release for up to 10 minutes after a deploy).
          // index.html removes it again before React Router sees the URL.
          '&_cb=' + Date.now() +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
